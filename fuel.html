<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摩托油耗计算器</title>
    <style>
        *{box-sizing: border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#1a1a1a;color:#eee;padding:24px;max-width:500px;margin:0 auto}
        .card{background:#272727;padding:24px;border-radius:16px}
        h2{color:#ff7b26;margin-bottom:20px;text-align:center}
        .item{margin-bottom:14px}
        label{display:block;margin-bottom:6px;color:#ccc}
        input{width:100%;padding:12px;border-radius:8px;border:none;background:#383838;color:#fff;font-size:16px}
        .result{margin-top:20px;padding:16px;background:#333;border-radius:10px}
        .res-item{margin:8px 0;font-size:17px}
        .tip{color:#ff5555;font-size:14px;margin-top:10px;display:none}
        button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:8px;background:#ff7b26;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
    </style>
</head>
<body>
    <div class="card">
        <h2>🏍️ 摩托油耗计算器</h2>
        <div class="item">
            <label>本次加油升数(L)</label>
            <input type="number" id="oil" step="0.01" placeholder="例：8.2">
        </div>
        <div class="item">
            <label>本次加油金额(元)</label>
            <input type="number" id="money" step="0.01" placeholder="例：60">
        </div>
        <div class="item">
            <label>两次加油之间行驶里程(km)</label>
            <input type="number" id="km" step="0.01" placeholder="例：180">
        </div>
        <div class="tip" id="errTip">里程不能为0或负数！</div>
        <div class="result" id="resultBox">
            <div class="res-item">百公里油耗：<span id="fuel100">--</span> L/100km</div>
            <div class="res-item">每公里花费：<span id="costKm">--</span> 元</div>
            <div class="res-item">当前油价：<span id="price">--</span> 元/L</div>
        </div>
        <button onclick="calc()">计算油耗</button>
    </div>

<script>
function calc(){
    const oil = parseFloat(document.getElementById('oil').value);
    const money = parseFloat(document.getElementById('money').value);
    const km = parseFloat(document.getElementById('km').value);
    const tip = document.getElementById('errTip');
    tip.style.display = 'none';
    if(isNaN(oil)||isNaN(money)||isNaN(km) || km <=0){
        tip.style.display='block';
        return;
    }
    const fuel100 = (oil / km * 100).toFixed(2);
    const costKm = (money / km).toFixed(2);
    const price = (money / oil).toFixed(2);
    document.getElementById('fuel100').innerText = fuel100;
    document.getElementById('costKm').innerText = costKm;
    document.getElementById('price').innerText = price;
}
</script>
</body>
</html>
